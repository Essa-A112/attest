services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: attest
      POSTGRES_PASSWORD: attest
      POSTGRES_DB: attest
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attest -d attest"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
